{{- $title := or .ssname "" -}}
{{- $isDiscussion := hasPrefix $title "Дискуссия. " -}}
{{- if $isDiscussion }}{{ $title = strings.TrimPrefix "Дискуссия. " $title }}{{ end -}}
<h3 class="display-6 fw-semibold mb-4"><mark class="text-white bg-success px-3">{{ .sstime }}</mark></h3>
{{- if $isDiscussion }}
<div class="mb-3"><div class="badge fw-normal text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-0 mt-3"><span class="display-8">Дискуссия</span></div></div>
{{- end }}
<h3 class="display-5 fw-bold mb-4 ptserif{{ if eq $title "Тема будет объявлена" }} text-body-secondary{{ end }}">{{ $title }}</h3>
